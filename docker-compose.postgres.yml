name: controle-viagens-postgres-simulation

services:
  postgres:
    image: postgres:16-alpine
    container_name: controle-viagens-postgres-sim
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controle_viagens}
      POSTGRES_USER: ${POSTGRES_USER:-controle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-controle_dev_only}
    # O sandbox não expõe a rede bridge por falta de iptables/raw; host é usado apenas na simulação local.
    network_mode: host
    volumes:
      - controle_viagens_pgdata_sim:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  controle_viagens_pgdata_sim:
    name: controle-viagens-pgdata-sim
