name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: controle_viagens_ci
          POSTGRES_USER: controle
          POSTGRES_PASSWORD: controle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U controle -d controle_viagens_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Prepare PostgreSQL test database
        env:
          DATABASE_URL: postgresql://controle:controle_ci@127.0.0.1:5432/controle_viagens_ci
        run: pnpm db:migrate && pnpm db:seed

      - name: Vitest
        env:
          TEST_DATABASE_URL: postgresql://controle:controle_ci@127.0.0.1:5432/controle_viagens_ci
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Compose bridge smoke environment
        env:
          JWT_SECRET: ci-only-ephemeral-secret-change-per-run
          FRONTEND_PORT: 8080
        run: docker compose -f compose.yaml up -d --build

      - name: Wait for Compose frontend
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.yaml ps
          docker compose -f compose.yaml logs --no-color
          exit 1

      - name: Playwright web E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: pnpm test:e2e

      - name: Compose logs on failure
        if: failure()
        env:
          JWT_SECRET: ci-only-ephemeral-secret-change-per-run
          FRONTEND_PORT: 8080
        run: docker compose -f compose.yaml logs --no-color

      - name: Tear down Compose
        if: always()
        env:
          JWT_SECRET: ci-only-ephemeral-secret-change-per-run
          FRONTEND_PORT: 8080
        run: docker compose -f compose.yaml down -v

  publish-images:
    name: Publish Docker images
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}/resultarpy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}-api
          tags: |
            type=raw,value=latest
            type=sha
            type=ref,event=branch

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Docker metadata frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}-frontend
          tags: |
            type=raw,value=latest
            type=sha
            type=ref,event=branch

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          target: runtime
          push: true
          build-args: |
            EXPO_PUBLIC_API_BASE_URL=
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
