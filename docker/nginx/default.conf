server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Sem isso, o Nginx usa o padrão dele (1MB) e rejeita silenciosamente
  # qualquer envio maior — foi o que quebrava o envio de fotos de
  # comprovante (o app permite até ~4MB de foto, que em base64 fica um
  # pouco maior ainda). 10MB dá folga confortável.
  client_max_body_size 10m;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}